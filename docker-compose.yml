services:
  db:
    image: postgres:16-alpine
    container_name: splitbill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitbill_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-splitbill}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - splitbill_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-splitbill} -d $${POSTGRES_DB:-splitbill}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  splitbill_postgres_data:
